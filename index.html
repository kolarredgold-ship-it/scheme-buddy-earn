<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0d6e6e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Techrola" />
    <link rel="apple-touch-icon" href="/pwa-icon-192.png" />
    <title>Techrola — Government Schemes Discovery & Digital Career Education Platform</title>
    <meta name="description" content="Techrola is an Indian edu-tech platform that helps users discover 550+ government schemes & scholarships, and provides paid digital career education services — AI mock interviews, internship report generation, and skill content — through a ₹999 annual Pro subscription." />
    <link rel="canonical" href="https://techrola.in/" />
    <meta name="author" content="Techrola" />

    <!-- TODO: Update og:title to match your application name -->
    
    
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://techrola.in/" />
    <meta property="og:site_name" content="Techrola" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="og:title" content="Techrola - Government Schemes & Career Resources">
    <meta name="twitter:title" content="Techrola - Government Schemes & Career Resources">
    <meta property="og:description" content="Access 550+ government schemes, scholarships, AI tools, and career resources. Find the best welfare programs for you.">
    <meta name="twitter:description" content="Access 550+ government schemes, scholarships, AI tools, and career resources. Find the best welfare programs for you.">
    <meta property="og:image" content="https://scheme-buddy-earn.lovable.app/techrola_logo.png">
    <meta name="twitter:image" content="https://scheme-buddy-earn.lovable.app/techrola_logo.png">
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "Techrola",
            "url": "https://techrola.in/",
            "logo": "https://techrola.in/techrola_logo.png",
            "email": "omlaytechnologies@gmail.com",
            "telephone": "+91-7899666679",
            "address": { "@type": "PostalAddress", "addressLocality": "Bengaluru", "addressCountry": "IN" }
          },
          {
            "@type": "WebSite",
            "name": "Techrola",
            "url": "https://techrola.in/",
            "description": "Discover 550+ Indian government schemes, scholarships, jobs, AI career tools, mock interviews and internship reports.",
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://techrola.in/?q={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>
</head>

  <body>
    <!-- Splash Screen -->
    <div id="splash-screen" style="position:fixed;inset:0;z-index:9999;background:#fff;display:flex;align-items:center;justify-content:center;transition:opacity 0.4s ease">
      <img src="/techrola_logo.webp" alt="Techrola" style="max-width:260px;width:70%;animation:splashPulse 1.5s ease-in-out infinite" />
    </div>
    <style>
      @keyframes splashPulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.03); }
      }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

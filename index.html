    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://smartlio.in/" />
    <meta property="og:site_name" content="Smartlio" />

    <meta property="og:title" content="Smartlio — AI Career Tools & Government Schemes" />
    <meta name="twitter:title" content="Smartlio — AI Career Tools & Government Schemes" />

    <meta name="twitter:description" content="Discover Indian government schemes and career programs with Smartlio. Create internship reports, resumes and SOPs, and practise AI mock interviews." />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "Smartlio",
            "url": "https://smartlio.in/",
            "logo": "https://smartlio.in/smartlio_logo.png",
            "email": "omlaytechnologies@gmail.com",
            "telephone": "+91-7899666679",
            "address": { "@type": "PostalAddress", "addressLocality": "Bengaluru", "addressCountry": "IN" }
          },
          {
            "@type": "WebSite",
            "name": "Smartlio",
            "url": "https://smartlio.in/",
            "description": "Discover 2500+ Indian government schemes, scholarships, jobs, AI career tools, mock interviews and internship reports.",
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://smartlio.in/?q={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>
</head>

  <body>
    <!-- Splash Screen -->
    <div id="splash-screen" style="position:fixed;inset:0;z-index:9999;background:#fff;display:flex;align-items:center;justify-content:center;transition:opacity 0.4s ease">
      <img src="/smartlio_logo.png" alt="Smartlio" style="max-width:260px;width:70%;animation:splashPulse 1.5s ease-in-out infinite" />
    </div>
    <style>
      @keyframes splashPulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.85; transform: scale(1.03); }
      }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

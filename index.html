<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0d6e6e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Techrola" />
    <link rel="apple-touch-icon" href="/pwa-icon-192.png" />
    <title>Techrola — Government Schemes Discovery & Digital Career Education Platform</title>
    <meta name="description" content="Techrola is an Indian edu-tech platform that helps users discover 2500+ government schemes & scholarships, and provides paid digital career education services — AI mock interviews, internship report generation, and skill content — through a ₹999 annual Pro subscription." />
    <link rel="canonical" href="https://techrola.in/" />
    <meta name="author" content="Techrola" />

    <!-- TODO: Update og:title to match your application name -->
    
    
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://techrola.in/" />
    <meta property="og:site_name" content="Techrola" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="og:title" content="Techrola - Government Schemes & Career Resources">
    <meta name="twitter:title" content="Techrola - Government Schemes & Career Resources">
    <meta property="og:description" content="Access 2500+ government schemes, scholarships, AI tools, and career resources. Find the best welfare programs for you.">
    <meta name="twitter:description" content="Access 2500+ government schemes, scholarships, AI tools, and career resources. Find the best welfare programs for you.">
    <meta property="og:image" content="https://scheme-buddy-earn.lovable.app/techrola_logo.png">
    <meta name="twitter:image" content="https://scheme-buddy-earn.lovable.app/techrola_logo.png">
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "name": "Techrola",
            "url": "https://techrola.in/",
            "logo": "https://techrola.in/techrola_logo.png",
            "email": "omlaytechnologies@gmail.com",
            "telephone": "+91-7899666679",
            "address": { "@type": "PostalAddress", "addressLocality": "Bengaluru", "addressCountry": "IN" }
          },
          {
            "@type": "WebSite",
            "name": "Techrola",
            "url": "https://techrola.in/",
            "description": "Discover 2500+ Indian government schemes, scholarships, jobs, AI career tools, mock interviews and internship reports.",
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://techrola.in/?q={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>
</head>

  <body>
    <!-- Splash Screen -->
    <div id="splash-screen" style="position:fixed;inset:0;z-index:9999;background:linear-gradient(135deg,#0c2340 0%,#1a4a6e 60%,#0c2340 100%);background-size:200% 200%;animation:splashBg 6s ease infinite;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 0.5s ease;font-family:'Space Grotesk',system-ui,sans-serif;">
      <div style="position:relative;display:flex;align-items:center;justify-content:center;">
        <div style="position:absolute;inset:-40px;border-radius:50%;background:radial-gradient(circle,rgba(251,191,36,0.35) 0%,rgba(251,191,36,0) 70%);animation:splashGlow 2s ease-in-out infinite;"></div>
        <div style="position:absolute;inset:-20px;border:2px solid rgba(251,191,36,0.4);border-radius:50%;animation:splashRing 2.2s ease-out infinite;"></div>
        <div style="position:absolute;inset:-20px;border:2px solid rgba(251,191,36,0.25);border-radius:50%;animation:splashRing 2.2s ease-out infinite;animation-delay:.8s;"></div>
        <img src="/techrola_logo.webp" alt="Techrola" style="max-width:220px;width:60%;position:relative;z-index:2;animation:splashPulse 1.6s ease-in-out infinite;filter:drop-shadow(0 8px 30px rgba(0,0,0,0.4));background:#fff;border-radius:24px;padding:14px 22px;" />
      </div>
      <div style="margin-top:32px;color:#fbbf24;font-weight:700;letter-spacing:.25em;font-size:11px;text-transform:uppercase;opacity:0;animation:splashFadeIn .9s ease .4s forwards;">Empowering Public &amp; Students</div>
      <div style="margin-top:18px;display:flex;gap:6px;">
        <span style="width:8px;height:8px;border-radius:50%;background:#fbbf24;animation:splashDot 1s ease-in-out infinite;"></span>
        <span style="width:8px;height:8px;border-radius:50%;background:#fbbf24;animation:splashDot 1s ease-in-out .2s infinite;"></span>
        <span style="width:8px;height:8px;border-radius:50%;background:#fbbf24;animation:splashDot 1s ease-in-out .4s infinite;"></span>
      </div>
    </div>
    <style>
      @keyframes splashPulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.04);} }
      @keyframes splashBg { 0%,100%{background-position:0% 50%;} 50%{background-position:100% 50%;} }
      @keyframes splashGlow { 0%,100%{opacity:.5;transform:scale(1);} 50%{opacity:1;transform:scale(1.12);} }
      @keyframes splashRing { 0%{transform:scale(.85);opacity:.9;} 100%{transform:scale(1.6);opacity:0;} }
      @keyframes splashFadeIn { to{opacity:1;} }
      @keyframes splashDot { 0%,100%{opacity:.3;transform:translateY(0);} 50%{opacity:1;transform:translateY(-4px);} }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
